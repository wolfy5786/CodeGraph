services:

  falkordb:
    image: falkordb/falkordb:latest
    container_name: codegraph-falkor
    environment:
      # Stable key for the bundled FalkorDB Browser's AES-GCM credential encryption.
      # Without a stable key it logs "Failed to resolve connection password (non-fatal):
      # Unsupported state or unable to authenticate data" on every connection attempt.
      ENCRYPTION_KEY: ${FALKOR_BROWSER_ENCRYPTION_KEY}
    ports:
      - "127.0.0.1:6379:6379"   # expose to host for local dev/inspection
      - "127.0.0.1:3000:3000"   # FalkorDB browser UI
    volumes:
      - falkordb_data:/data
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: .                          # repo root — both service paths are reachable
      dockerfile: services/api/Dockerfile
    container_name: codegraph-backend
    environment:
      FALKOR_HOST: falkordb
      FALKOR_PORT: "6379"
      API_HOST: "0.0.0.0"
      API_PORT: "8765"
      REPOS_ROOT_HOST: ${REPOS_ROOT}
      REPOS_ROOT_CONTAINER: /repos
    volumes:
      - ${REPOS_ROOT}:/repos:ro
    depends_on:
      falkordb:
        condition: service_healthy
    restart: unless-stopped
    # Not exposed to the host — all traffic goes through the ui/nginx proxy

  ui:
    build:
      context: .                          # repo root — both service paths are reachable
      dockerfile: services/ui/Dockerfile
    container_name: codegraph-ui
    ports:
      - "127.0.0.1:8765:80"             # same URL as manual dev: http://127.0.0.1:8765
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  falkordb_data:
    driver: local
