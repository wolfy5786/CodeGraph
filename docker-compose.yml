# Only FalkorDB runs in a container. The API/UI and ingestion worker run
# natively on the host (see README "Getting started").
services:

  falkordb:
    image: falkordb/falkordb:latest
    container_name: codegraph-falkor
    environment:
      # Stable key for the bundled FalkorDB Browser's AES-GCM credential encryption.
      # Without a stable key it logs "Failed to resolve connection password (non-fatal):
      # Unsupported state or unable to authenticate data" on every connection attempt.
      ENCRYPTION_KEY: ${FALKOR_BROWSER_ENCRYPTION_KEY}
    ports:
      - "127.0.0.1:6379:6379"   # expose to host for the natively-run backend
      - "127.0.0.1:3000:3000"   # FalkorDB browser UI
    volumes:
      - falkordb_data:/data
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  falkordb_data:
    driver: local
